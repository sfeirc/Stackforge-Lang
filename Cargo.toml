[package]
name = "stackforge"
version = "0.1.0"
edition = "2021"
description = "A complete programming language: lexer, Pratt parser, tree-walking interpreter, and stack-based bytecode VM."
license = "MIT"
repository = "https://github.com/sfeirc/Stackforge-Lang"

[[bin]]
name = "stackforge"
path = "src/main.rs"

[lib]
name = "stackforge"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "vm_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
